<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect your Moodle account</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.3rem; }
  label { display: block; margin-top: 14px; font-size: 0.9rem; font-weight: 600; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 1rem; }
  button { margin-top: 20px; width: 100%; padding: 10px; font-size: 1rem; cursor: pointer; }
  #msg { margin-top: 16px; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>Connect your Moodle account</h1>
<p>Your password is sent once to verify against your Moodle site and is never stored — only a Moodle access token is kept.</p>
<form id="f">
  <label>Moodle site URL</label>
  <input name="moodleUrl" placeholder="https://moodle.myschool.edu" required>
  <label>Username</label>
  <input name="username" required>
  <label>Password</label>
  <input name="password" type="password" required>
  <button type="submit">Connect</button>
</form>
<div id="msg"></div>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    msg.textContent = "Connecting...";
    const fd = new FormData(e.target);
    try {
      const res = await fetch("/api/connect", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          code,
          moodleUrl: fd.get("moodleUrl"),
          username: fd.get("username"),
          password: fd.get("password"),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed");
      msg.textContent = "Connected! Go back to Telegram.";
      e.target.reset();
    } catch (err) {
      msg.textContent = "Error: " + err.message;
    }
  });
</script>
</body>
</html>
